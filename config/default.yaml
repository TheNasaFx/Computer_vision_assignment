# ═══════════════════════════════════════════════════════════════
#  Real-Time Object Detection System — Configuration
# ═══════════════════════════════════════════════════════════════

model:
  name: yolo26l.pt            # yolo26n/s/m/l/x .pt  (large = best accuracy)
  confidence: 0.15
  iou_threshold: 0.5
  max_detections: 100
  device: "0"                  # "0" for GPU, "cpu" for CPU
  half: true                   # FP16 inference
  img_size: 1280               # higher res = better small object detection
  classes: null                # null = all classes, or list e.g. [0, 1, 2]

stream:
  sources:                     # list of inputs
    - "0"                      # webcam index or path/url
  buffer_size: 2
  reconnect_delay: 5.0
  max_retries: 10

tracker:
  enabled: true
  type: bytetrack              # bytetrack or botsort
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 30
  match_thresh: 0.8

events:
  enabled: false
  roi_zones: []                # list of polygon zones
  line_crossing:
    enabled: false
    lines: []                  # [{start: [x1,y1], end: [x2,y2], name: "line1"}]

visualization:
  show_window: true
  show_fps: true
  show_boxes: true
  show_labels: true
  show_confidence: true
  show_tracks: true
  box_thickness: 2
  font_scale: 0.6
  trail_length: 30

output:
  save_video: false
  video_path: "output/result.mp4"
  video_fps: 30
  codec: "mp4v"
  json_output: false
  json_path: "output/detections.json"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1

# ── Pose model (used to refine ownership with wrist keypoints) ────
pose:
  enabled: true                # Off → ownership uses torso-centre only
  model: yolo11l-pose.pt       # YOLO pose model (auto-downloads on first run)
  confidence: 0.4              # Person detection threshold for pose model
  kpt_confidence: 0.35         # Per-keypoint visibility threshold
  img_size: 960                # Pose runs at lower resolution for speed
  iou_match_threshold: 0.3     # Pose-bbox ↔ tracked-person matching IoU

study_space:
  enabled: false               # Toggle study-space mode
  object_classes:              # COCO classes treated as personal items
    - laptop
    - cell phone
    - book
    - backpack
    - handbag
    - bottle
    - cup
    - mouse
    - keyboard
    - suitcase
    - umbrella
    - remote
    - scissors

  # Stateful, track-aware ownership inference
  ownership:
    max_distance: 240          # px: bbox-centre proximity needed to score
    wrist_distance: 90         # px: wrist→object distance for strong bonus
    base_gain: 1.0             # Score gained per frame at zero centre distance
    wrist_bonus: 2.5           # Extra score when a wrist is on/near the object
    decay: 0.94                # Multiplicative score decay per frame
    max_score: 30.0            # Cap so a single confirmed owner cannot run away
    confirmation_score: 6.0    # Score needed to *confirm* an owner
    margin_factor: 1.6         # Lead over runner-up needed for confirm/switch
    min_keep_score: 2.0        # Below this, sticky owner can be dropped
    memory_ttl_seconds: 12.0   # Forget objects unseen for this long

  # Owner-departure / abandonment state machine
  abandonment:
    presence_grace_seconds: 1.5    # Owner can briefly leave proximity (no flicker)
    abandoned_after_seconds: 20.0  # AWAY this long → ABANDONED (alert emitted)
    critical_after_seconds: 60.0   # ABANDONED this long → severity = critical
    max_active_alerts: 20

  zones: []                    # Desk/seat zones — list of {id, name, points}
    # Example:
    # - id: desk_1
    #   name: "Desk 1"
    #   points: [[100,200],[400,200],[400,500],[100,500]]

logging:
  level: "INFO"                # DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"
  console: true
